name: Kaggle official-data CPU pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-data-cpu-pilot.yml'
permissions:
  contents: read
concurrency:
  group: kaggle-official-cpu-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies and Kaggle CLI
        run: python -m pip install -r requirements.txt 'kaggle>=1.7,<3'
      - name: Download official competition data into ephemeral runner
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo '::error::No KAGGLE_API_TOKEN or KAGGLE_TOKEN repository secret.'
            exit 1
          fi
          mkdir -p data
          kaggle competitions download llm-classification-finetuning -f train.csv -p data --unzip -q
          test -s data/train.csv || { echo '::error::Official train.csv missing. Have you accepted the competition rules?'; exit 1; }
          echo 'Official train.csv downloaded securely (data will not be uploaded).'
      - name: Fit CPU baseline and publish only aggregate metrics
        run: python -m scripts.run_official_cpu_pilot --train data/train.csv --out artifacts/official_cpu_pilot --sample-size 12000
      - name: Upload aggregate-only results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: official-cpu-pilot-aggregate
          path: artifacts/official_cpu_pilot/summary.json
          retention-days: 14
          if-no-files-found: error
# No downloaded CSVs, trained models, raw prompts or secrets are uploaded.
