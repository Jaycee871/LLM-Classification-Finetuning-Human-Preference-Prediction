name: Verify Kaggle access (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check that the token secret exists (without revealing it)
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::error::Add KAGGLE_API_TOKEN (preferred) or KAGGLE_TOKEN as a repository secret."
            exit 1
          fi
          echo 'A token secret is configured.'
      - run: python -m pip install 'kaggle>=1.7'
      - name: Verify competition file listing
        run: kaggle competitions files llm-classification-finetuning
      # Do not download or publish competition data or print secret values.
